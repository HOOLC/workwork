[package]
name = "zork-call"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zork-call"
path = "src/bin/zork-call.rs"

[[bin]]
name = "zork-gh"
path = "src/bin/zork-gh.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest.workspace = true
serde_json = "1"

[dev-dependencies]
tempfile = "3"
