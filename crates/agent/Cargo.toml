[package]
name = "zork-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "zork_agent"
path = "src/lib.rs"

[[bin]]
name = "zork-agent"
path = "src/main.rs"

[dependencies]
aimux-core = "0.3.0"
aimux-provider-utils = "0.3.0"
aimux-providers = "0.3.0"
aimux-stream = "0.3.0"
anyhow = "1"
async-stream = "0.3.6"
async-trait = "0.1"
axum = "0.8.4"
base64 = "0.22"
fs2 = "0.4.3"
futures-util.workspace = true
jsonschema = { version = "0.49.7", default-features = false }
libc = "0.2.180"
percent-encoding = "2"
reqwest.workspace = true
serde.workspace = true
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1.1.3"
url = "2.5.8"
zstd = "0.13.3"
zork-agent-api = { path = "../agent-api" }
zork-config = { path = "../zork-config" }
zork-profile = { path = "../profile" }

[dev-dependencies]
tempfile = "3"
