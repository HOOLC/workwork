[package]
name = "zork-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zork-gui"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-unofficial", version = "1.17.0-pre" }
gpui-platform = { package = "gpui-platform-gpui-unofficial", version = "1.17.0-pre", features = ["font-kit", "test-support", "wayland", "x11"] }
reqwest.workspace = true
futures-util.workspace = true
futures-channel = "0.3.31"
tokio.workspace = true
serde.workspace = true
serde_json = "1.0.145"
thiserror = "2.0.17"
bytes = "1"
zork-config = { path = "../zork-config" }
unicode-segmentation = "1.12"
markdown = "1.0.0"
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
