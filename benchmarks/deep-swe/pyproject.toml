[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zork-deep-swe-benchmark"
version = "0.1.0"
description = "Reproducible DeepSWE benchmark runner and agent adapters for Zork"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["datacurve-pier==0.3.1", "zstandard>=0.23,<1"]

[project.scripts]
zork-deep-swe = "zork_deepswe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zork_deepswe"]
